name: Isolated NEXT-75 QA - no publishing

on:
  push:
    branches:
      - feature/NEXT-75-archive-compatibility

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Enforce zero known dependency advisories
        run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify reproducible second build
        shell: bash
        run: |
          before="$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          npm ci --no-audit --no-fund
          npm run build
          after="$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$before" = "$after"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already live
        id: live
        shell: bash
        run: |
          LIVE_VERSION="$(curl -fsS https://www.vowikron.de/try_folder/robot-arena/version.json 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"
          LIVE_COMMIT="$(curl -fsS https://www.vowikron.de/try_folder/robot-arena/build-info.json 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"
          echo "live_version=$LIVE_VERSION" >> "$GITHUB_OUTPUT"
          echo "live_commit=$LIVE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Repository version: ${{ steps.version.outputs.version }}"
          echo "Target commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Live version: $LIVE_VERSION"
          echo "Live commit: $LIVE_COMMIT"
          if [[ "$LIVE_VERSION" == "${{ steps.version.outputs.version }}" && "$LIVE_COMMIT" == "${{ github.event.workflow_run.head_sha }}" ]]; then
            echo "Exact version and commit are already live. Publish will be skipped."
          else
            echo "Live deployment differs from the tested main SHA. Publish will proceed."
          fi

      - name: Install dependencies
        if: ${{ steps.live.outputs.live_version != steps.version.outputs.version || steps.live.outputs.live_commit != github.event.workflow_run.head_sha }}
        run: npm install

      - name: Build
        if: ${{ steps.live.outputs.live_version != steps.version.outputs.version || steps.live.outputs.live_commit != github.event.workflow_run.head_sha }}
        run: npm run build

      - name: Add release metadata
        if: ${{ steps.live.outputs.live_version != steps.version.outputs.version || steps.live.outputs.live_commit != github.event.workflow_run.head_sha }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Berlin")
          now = datetime.now(tz)
          next_run = now.replace(hour=18, minute=0, second=0, microsecond=0)
          if now >= next_run:
              next_run += timedelta(days=1)

          data = {
              "version": os.environ["VERSION"],
              "commit": os.environ["BUILD_COMMIT"],
              "builtAt": now.isoformat(),
              "nextRunAt": next_run.isoformat(),
              "quality": {
                  "typecheck": "passed",
                  "unit": "passed",
                  "build": "passed",
                  "desktopE2E": "passed",
                  "mobileE2E": "passed"
              }
          }
          with open("dist/build-info.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Package release
        if: ${{ steps.live.outputs.live_version != steps.version.outputs.version || steps.live.outputs.live_commit != github.event.workflow_run.head_sha }}
        run: |
          cd dist
          zip -r ../robot-arena-release.zip .

      - name: Publish to vowikron.de
        if: ${{ steps.live.outputs.live_version != steps.version.outputs.version || steps.live.outputs.live_commit != github.event.workflow_run.head_sha }}
        env:
          PUBLISH_TOKEN: ${{ secrets.ROBOT_ARENA_PUBLISH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$PUBLISH_TOKEN" || (echo "ROBOT_ARENA_PUBLISH_TOKEN is missing" && exit 1)
          curl --fail-with-body \
            -F "token=$PUBLISH_TOKEN" \
            -F "version=v$VERSION" \
            -F "file=@robot-arena-release.zip" \
            https://www.vowikron.de/try_folder/robot-arena/publish.php

      - name: Verify deployment
        if: ${{ steps.live.outputs.live_version != steps.version.outputs.version || steps.live.outputs.live_commit != github.event.workflow_run.head_sha }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sleep 2
          curl --fail https://www.vowikron.de/try_folder/robot-arena/
          curl --fail https://www.vowikron.de/try_folder/robot-arena/testsuite.html
          curl --fail https://www.vowikron.de/try_folder/robot-arena/release-notes.html
          curl --fail https://www.vowikron.de/try_folder/robot-arena/backlog.html
          curl --fail https://www.vowikron.de/try_folder/robot-arena/releases/v$VERSION/
          curl --fail https://www.vowikron.de/try_folder/robot-arena/version.json
          curl --fail https://www.vowikron.de/try_folder/robot-arena/build-info.json
          LIVE_COMMIT="$(curl -fsS https://www.vowikron.de/try_folder/robot-arena/build-info.json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit", ""))')"
          test "$LIVE_COMMIT" = "${{ github.event.workflow_run.head_sha }}" || (echo "Published commit mismatch: $LIVE_COMMIT" && exit 1)

      - name: Record verified deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DEPLOYED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOYED_COMMIT" \
            -f state="success" \
            -f context="robot-arena/deployment" \
            -f description="v$VERSION verified live on vowikron.de"

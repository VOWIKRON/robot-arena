name: Publish (manual, verified)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full main commit SHA approved for deployment"
        required: true
        type: string
      same_version:
        description: "Same-version policy"
        required: true
        default: "skip-identical"
        type: choice
        options:
          - skip-identical
          - reject
          - current-only

permissions:
  contents: read

concurrency:
  group: robot-arena-manual-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicitly approved main commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "refs/heads/main"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible install and complete quality gate
        run: |
          set -euo pipefail
          npm ci
          npm run quality
          npx playwright install --with-deps

      # NEXT-106: never let the NEXT-120 manual publisher bypass the evidence
      # gate that protects Development Tests. The same raw runner JSON is required.
      - name: Collect browser evidence (Chromium/WebKit desktop/mobile)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: next97-browser-matrix.json
        run: npx playwright test --reporter=json
      - name: Enforce NEXT-97 browser compatibility gate
        run: node scripts/next97-browser-release-gate.mjs next97-browser-matrix.json next97-browser-gate.json
      - name: Collect NEXT-106 focused unit/behavior evidence
        run: npx vitest run tests/adaptive-strategy.test.ts tests/next104-integration.test.ts tests/next105-adaptive-balance.test.ts --reporter=json --outputFile=next106-vitest-evidence.json
      - name: Enforce NEXT-106 integrated evidence gate before any upload
        run: node scripts/next106-integrated-release-gate.mjs next106-vitest-evidence.json next97-browser-matrix.json next106-gate-result.json
      - name: Save fail-closed evidence for manual release review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-arena-manual-publish-evidence
          path: |
            next106-vitest-evidence.json
            next106-gate-result.json
            next97-browser-matrix.json
            next97-browser-gate.json
          if-no-files-found: error

      - name: Check immutable release archive before publishing
        id: guard
        env:
          POLICY: ${{ inputs.same_version }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BASE="https://www.vowikron.de/try_folder/robot-arena"
          LIVE_VERSION="$(curl -fsS "$BASE/version.json" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("version",""))' || true)"
          LIVE_COMMIT="$(curl -fsS "$BASE/build-info.json" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit",""))' || true)"
          if [[ "$LIVE_VERSION" == "$VERSION" ]]; then
            if [[ "$LIVE_COMMIT" == "$GITHUB_SHA" && "$POLICY" == "skip-identical" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Already live at identical version and commit; no archive overwritten."
              exit 0
            fi
            if [[ "$POLICY" == "current-only" && "$LIVE_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "mode=current-only" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Same version with different commit: choose current-only explicitly or bump version."
            exit 1
            exit 1
          fi
          # Existing archived release must never be overwritten, even if current version differs.
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/releases/v$VERSION/" || true)"
          if [[ "$CODE" != "404" ]]; then
            echo "::error::Archive URL returned HTTP $CODE (not proven absent). Refusing overwrite."
            exit 1
          fi
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Add immutable build metadata and manifest
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          (root/'build-info.json').write_text(json.dumps({'version':os.environ['VERSION'],'commit':os.environ['GITHUB_SHA']},sort_keys=True)+'\n')
          # Hash all actual deployed assets except the manifest itself.
          manifest = {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='publish-manifest.json'}
          (root/'publish-manifest.json').write_text(json.dumps({'version':os.environ['VERSION'],'commit':os.environ['GITHUB_SHA'],'files':manifest},sort_keys=True,indent=2)+'\n')
          PY
          (cd dist && zip -q -r ../robot-arena-release.zip .)
          sha256sum robot-arena-release.zip

      - name: Upload release using existing server publisher
        if: steps.guard.outputs.skip != 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.ROBOT_ARENA_PUBLISH_TOKEN }}
          VERSION: ${{ steps.guard.outputs.version }}
          MODE: ${{ steps.guard.outputs.mode }}
        run: |
          set -euo pipefail
          test -n "$PUBLISH_TOKEN"
          curl --fail-with-body --retry 2 --connect-timeout 15 --max-time 120 \
            -F "token=$PUBLISH_TOKEN" -F "version=v$VERSION" -F "mode=$MODE" \
            -F "file=@robot-arena-release.zip" \
            https://www.vowikron.de/try_folder/robot-arena/publish.php

      - name: Verify every live file against release manifest
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          base='https://www.vowikron.de/try_folder/robot-arena/'
          def fetch(path):
              with urllib.request.urlopen(base+path,timeout=30) as response:
                  if response.status != 200: raise RuntimeError(f'{path}: HTTP {response.status}')
                  return response.read()
          remote_bytes=fetch('publish-manifest.json')
          if os.path.exists('dist/publish-manifest.json'):
              with open('dist/publish-manifest.json','rb') as local:
                  assert hashlib.sha256(remote_bytes).digest()==hashlib.sha256(local.read()).digest(), 'Live manifest differs from approved build'
          remote=json.loads(remote_bytes)
          assert remote['version']==os.environ['VERSION']
          assert remote['commit']==os.environ['GITHUB_SHA']
          for path,digest in remote['files'].items():
              assert not path.startswith('/') and '..' not in path.split('/')
              actual=hashlib.sha256(fetch(path)).hexdigest()
              if actual != digest: raise RuntimeError(f'Live checksum mismatch: {path}')
          assert json.loads(fetch('build-info.json'))['commit']==os.environ['GITHUB_SHA']
          print(f"Verified {len(remote['files'])} live files for v{remote['version']} at {remote['commit']}")
          PY
